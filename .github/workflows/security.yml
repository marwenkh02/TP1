name: Security Scanning Pipeline

on: [push, pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python (ensure Python 3.x is used)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Step 3: Install OWASP Dependency-Check
      - name: Install OWASP Dependency-Check
        run: |
          sudo apt-get install -y owasp-dependency-check  # Install Dependency-Check

      # Step 4: Install SonarQube Scanner
      - name: Install SonarQube Scanner
        run: |
          # Download and unzip SonarQube Scanner
          wget https://github.com/SonarSource/sonar-scanner-cli/releases/download/4.7.0.2747/sonar-scanner-4.7.0.2747-linux.zip
          unzip sonar-scanner-4.7.0.2747-linux.zip
          sudo mv sonar-scanner-4.7.0.2747-linux /opt/sonar-scanner
          sudo ln -s /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner

      # Step 5: Run SonarQube Scanner
      - name: Run SonarQube Scanner
        run: |
          sonar-scanner \
            -Dsonar.projectKey=marwenkh02_TP1 \
            -Dsonar.sources=./ \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}  # Ensure SONAR_TOKEN is set in GitHub secrets

      # Step 6: Run OWASP Dependency-Check
      - name: Run OWASP Dependency-Check
        run: |
          dependency-check --project your_project_name --scan . --out .  # Scan for vulnerabilities in dependencies

      # Step 7: Save the Reports as Artifacts
      - name: Upload SonarQube Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: ./sonar-report.json  # Adjust the report file location based on your setup

      - name: Upload Dependency-Check Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ./dependency-check-report.html  # Adjust based on Dependency-Check output location
