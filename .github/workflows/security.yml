name: Security Scanning Pipeline

on: [push, pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python (ensure Python 3.x is used)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Step 3: Install Java (needed for OWASP Dependency-Check)
      - name: Install Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre  # Install Java (required for OWASP Dependency-Check)

      # Step 4: Install OWASP Dependency-Check
      - name: Install OWASP Dependency-Check
        run: |
          # Download and unzip OWASP Dependency-Check
          wget https://github.com/jeremylong/DependencyCheck/releases/download/v8.4.0/dependency-check-8.4.0-release.zip
          unzip dependency-check-8.4.0-release.zip
          export PATH=$PATH:$(pwd)/dependency-check-8.4.0/bin  # Add Dependency-Check to PATH

      # Step 5: Install SonarQube Scanner
      - name: Install SonarQube Scanner
        run: |
          # Download the latest SonarQube Scanner
          wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.7.0.2747-linux.zip
          unzip sonar-scanner-cli-4.7.0.2747-linux.zip -d sonar-scanner

          # Check if unzip was successful and list files
          ls -la sonar-scanner

          # Move the extracted folder to /opt
          sudo mv sonar-scanner/sonar-scanner-cli-4.7.0.2747-linux /opt/sonar-scanner
          sudo ln -s /opt/sonar-scanner/bin/sonar-scanner /usr/local/bin/sonar-scanner

      # Step 6: Run SonarQube Scanner
      - name: Run SonarQube Scanner
        run: |
          sonar-scanner \
            -Dsonar.projectKey=marwenkh02_TP1 \
            -Dsonar.sources=./ \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}  # Ensure SONAR_TOKEN is set in GitHub secrets

      # Step 7: Run OWASP Dependency-Check
      - name: Run OWASP Dependency-Check
        run: |
          dependency-check --project your_project_name --scan . --out .  # Scan for vulnerabilities in dependencies

      # Step 8: Save the Reports as Artifacts
      - name: Upload SonarQube Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: ./sonar-report.json  # Adjust the report file location based on your setup

      - name: Upload Dependency-Check Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: ./dependency-check-report.html  # Adjust based on Dependency-Check output location
